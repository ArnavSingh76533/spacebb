name: Build Space Browser APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore preview signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: space-preview-signing-v1
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare verified offline filter list
        run: python3 scripts/prepare-filters.py
      - name: Build and verify
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease assembleDebug assembleDebugAndroidTest
      - name: Package APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/Space-Browser.apk
          cd artifacts
          sha256sum Space-Browser.apk > SHA256SUMS.txt
          echo "### Space Browser APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Installable preview APK: $(du -h Space-Browser.apk | cut -f1). Android 10+." >> "$GITHUB_STEP_SUMMARY"
          echo "Download Space-Browser-APK from this run's Artifacts section." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Space-Browser-APK
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: test-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
  device-test:
    name: Android device smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: test-apks
          path: test-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on Android 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          script: bash scripts/device-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-screenshots-and-logs
          path: device-results/
  preview:
    name: Publish installable preview
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, device-test]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Space-Browser-APK
          path: artifacts
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.0-preview.${GITHUB_RUN_NUMBER}" artifacts/Space-Browser.apk artifacts/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Space Browser 1.0 · Preview ${GITHUB_RUN_NUMBER}" \
            --notes 'Native lightweight Android browser with Space shields, private browsing, tabs and developer tools. Android 10+. This is a preview signed with a CI debug identity, not a production signing key. Back up bookmarks before replacing an older preview if Android reports a signing conflict.'
